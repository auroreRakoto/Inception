services:
  nginx:
    build: ./requirements/nginx
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "443:443"

  mariadb:
    build: ./requirements/mariadb
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wp_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
